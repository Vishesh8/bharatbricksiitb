bundle:
  name: iitb_baap_agent

sync:
  exclude:
    - e2e-chatbot-app-next/node_modules/
    - e2e-chatbot-app-next/**/node_modules/
    - e2e-chatbot-app-next/**/dist/
    - e2e-chatbot-app-next/**/.next/
    - .venv/
    - __pycache__/
    - "*.pyc"
    - .env
    - .env.example
    - mlflow.db

resources:
  apps:
    iitb_baap_agent:
      name: "iitb-baap-agent"
      description: "IIT Bombay Campus Advisor - Agentic RAG with Genie"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          # Resource configuration (loaded by agent_server/config.py)
          - name: DATABRICKS_CATALOG
            value: "iitb"
          - name: DATABRICKS_SCHEMA
            value: "bharat_bricks"
          - name: GENIE_SPACE_ID
            value: "01f135a25c7a1f63b039f802c37eaf5e"
          - name: VECTOR_SEARCH_INDEX
            value: "iitb.bharat_bricks.vs_gold_posts_index"
          - name: MODEL_ENDPOINT
            value: "databricks-qwen3-next-80b-a3b-instruct"

      # Resources which this app has access to
      resources:
        # MLflow experiment for tracing
        - name: 'experiment'
          experiment:
            experiment_id: "1568566937566223"
            permission: 'CAN_MANAGE'

        # Vector Search Index (RAG)
        - name: 'posts_vector_index'
          uc_securable:
            securable_full_name: 'iitb.bharat_bricks.vs_gold_posts_index'
            securable_type: 'TABLE'
            permission: 'SELECT'

        # Genie Space (Analytics)
        - name: 'iitb_genie'
          genie_space:
            name: 'IITB Junta Analytics'
            space_id: '01f135a25c7a1f63b039f802c37eaf5e'
            permission: 'CAN_RUN'

        # NOTE: MLflow Prompt Registry requires CREATE_FUNCTION, EXECUTE, and
        # MANAGE on the schema. These cannot be granted via bundle resources
        # (only FUNCTION/TABLE/VOLUME securables are supported). Grant manually:
        #   databricks grants update schema iitb.bharat_bricks \
        #     --json '{"changes":[{"principal":"<app-sp>","add":["EXECUTE","CREATE_FUNCTION"]}]}'

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-d3bdf797-f90e.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-d3bdf797-f90e.cloud.databricks.com
    resources:
      apps:
        iitb_baap_agent:
          name: iitb-baap-agent
