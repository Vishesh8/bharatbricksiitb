bundle:
  name: iitb_baap_agent

variables:
  # Unity Catalog configuration
  catalog_name:
    description: "Unity Catalog name containing the agent resources"

  schema_name:
    description: "Schema name within the catalog"

  vector_index_name:
    description: "Vector search index name for RAG (posts documents)"

  # Genie configuration
  genie_space_id:
    description: "Genie Space ID for analytics queries"

  # Prompt configuration (with defaults)
  prompt_name:
    description: "Prompt registry name"
    default: "iitb-lingo-prompt"

  prompt_alias:
    description: "Prompt version alias (e.g., production, latest)"
    default: "production"

  # MLflow experiment
  mlflow_experiment_id:
    description: "MLflow experiment ID for tracing"

resources:
  apps:
    iitb_baap_agent:
      name: "iitb-baap-agent"
      description: "IIT Bombay Campus Advisor - Agentic RAG with Genie"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: CATALOG_NAME
            value: "${var.catalog_name}"
          - name: SCHEMA_NAME
            value: "${var.schema_name}"
          - name: VECTOR_INDEX_NAME
            value: "${var.vector_index_name}"
          - name: GENIE_SPACE_ID
            value: "${var.genie_space_id}"
          - name: PROMPT_NAME
            value: "${var.prompt_name}"
          - name: PROMPT_ALIAS
            value: "${var.prompt_alias}"

      # Resources which this app has access to
      resources:
        # MLflow experiment for tracing
        - name: 'experiment'
          experiment:
            experiment_id: "${var.mlflow_experiment_id}"
            permission: 'CAN_MANAGE'

        # Vector Search Index (RAG)
        - name: 'posts_vector_index'
          uc_securable:
            securable_full_name: '${var.catalog_name}.${var.schema_name}.${var.vector_index_name}'
            securable_type: 'TABLE'
            permission: 'SELECT'

        # Genie Space (Analytics)
        - name: 'iitb_genie'
          genie_space:
            name: 'IITB Junta Analytics'
            space_id: '${var.genie_space_id}'
            permission: 'CAN_RUN'

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    resources:
      apps:
        iitb_baap_agent:
          name: iitb-baap-agent
