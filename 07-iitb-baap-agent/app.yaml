command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  # Resource configuration (loaded by agent_server/config.py)
  - name: DATABRICKS_CATALOG
    value: "iitb"
  - name: DATABRICKS_SCHEMA
    value: "bharat_bricks"
  - name: GENIE_SPACE_ID
    value: "01f135a25c7a1f63b039f802c37eaf5e"
  - name: VECTOR_SEARCH_INDEX
    value: "iitb.bharat_bricks.vs_gold_posts_index"
  - name: MODEL_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"
  - name: PROMPT_NAME
    value: "iitb_lingo_prompt"
  - name: PROMPT_ALIAS
    value: "production"
